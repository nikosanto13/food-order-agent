name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --all-extras
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      # Voice is an optional extra: the core must install, import and pass without it.
      - name: Tests without optional extras
        run: |
          uv sync --locked  # exact by default: removes the extras
          uv run pytest
